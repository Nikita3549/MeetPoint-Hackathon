stages:
  - lint
  - deploy

lint:
  stage: lint
  image: node:22-alpine
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run lint
    - npm run format:check
  only:
    - master

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf "%b\n" "$CI_BACKEND_SSH_KEY" > ~/.ssh/id.pem
    - chmod 600 ~/.ssh/id.pem
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id.pem ubuntu@130.193.43.223 "cd backend-prod && git pull && docker compose --profile api build && docker compose --profile api up -d"
  only:
    - master
