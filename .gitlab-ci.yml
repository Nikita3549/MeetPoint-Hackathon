stages:
  - lint
  - test
  - deploy

lint:
  stage: lint
  image: node:22-alpine
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run lint
    - npm run format:check
  only:
    - master

.unit_coverage:
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura

unit-tests:
  stage: test
  image: node:22-bookworm
  extends: .unit_coverage
  variables:
    DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  before_script:
    - npm ci --ignore-scripts
    - npx prisma generate --schema prisma/schema
  script:
    - npm run test:cov
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  only:
    - master

e2e-tests:
  stage: test
  image: node:22-bookworm
  extends: .unit_coverage
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: ci
    DATABASE_URL: postgresql://ci:ci@postgres:5432/ci?schema=public
    JWT_SECRET: ci-jwt-secret
    CLOUDINARY_NAME: e2e-cloud
    CLOUDINARY_KEY: e2e-key
    CLOUDINARY_SECRET: e2e-secret
    DOTENV_CONFIG_QUIET: 'true'
  before_script:
    - npm ci --ignore-scripts
    - npx prisma generate --schema prisma/schema
    - npx prisma migrate deploy --schema prisma/schema
  script:
    - npm run test:e2e:cov
  artifacts:
    when: always
    paths:
      - coverage/e2e/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/e2e/cobertura-coverage.xml
  only:
    - master

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf "%b\n" "$CI_BACKEND_SSH_KEY" > ~/.ssh/id.pem
    - chmod 600 ~/.ssh/id.pem
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id.pem ubuntu@130.193.43.223 "cd backend-prod && git pull && docker compose --profile api build && docker compose --profile api up -d"
  only:
    - master
