services:
  api:
    build:
      context: .
    profiles:
      - api
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - ./.env:/opt/api/.env
      - ./prisma.config.ts:/opt/api/prisma.config.ts
    networks:
      - main
    depends_on:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${API_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  database:
    image: postgres:17-alpine
    restart: always
    networks:
      - main
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_DBNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DATABASE_PORT}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER} -d ${DATABASE_DBNAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  main:
    driver: bridge

volumes:
  postgres_data: